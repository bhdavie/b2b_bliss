# Dropwizard config. Values default for local dev; env vars override.

server:
  applicationConnectors:
    # Heroku injects $PORT and routes only that port. Locally it is unset and
    # the 8080 default stands.
    - type: http
      port: ${PORT:-8080}
  adminConnectors:
    # Not routed on Heroku (only $PORT is), but still bound inside the dyno for
    # healthchecks and metrics. Override if it ever collides with $PORT.
    - type: http
      port: ${BLISS_ADMIN_PORT:-8081}
  rootPath: /

logging:
  level: INFO
  appenders:
    - type: console
      layout:
        type: json
      timeZone: UTC
  loggers:
    com.bliss.b2b: ${BLISS_LOG_LEVEL:-INFO}
    bliss.email: INFO
    org.flywaydb: INFO

env: ${BLISS_ENV:-development}

# Password-less demo sign-in. Outside production it is always on. Set true to
# keep it on under BLISS_ENV=production for the hosted demo: POST
# /api/v1/auth/dev-login then issues a merchant session for any email, which is
# also what the Marbrook funnel and the Mews authorize simulation rely on.
#
# Scoped to auth only — it does not reopen the dev plan endpoints or soften any
# other production rule. Set false once BLISS_POSTMARK_TOKEN is configured and
# magic link should be the only way in; the sign-in page follows this flag with
# no code change.
demoLogin: ${BLISS_DEMO_LOGIN:-false}

# Demo safety valve. When > 0, outgoing charge amounts are clamped to this many
# cents at execution time only (plan math and responses keep real amounts).
# 0 (default) disables the cap.
chargeCapCents: ${BLISS_CHARGE_CAP_CENTS:-0}

app:
  # Merchant dashboard (property.bliss-payments.com in prod): magic-link sign-in
  # and the Stripe Connect return url.
  merchantBaseUrl: ${BLISS_MERCHANT_BASE_URL:-http://localhost:3000}
  # Consumer portal and checkout (guest.bliss-payments.com in prod): hosted pay
  # links and the manage-your-plan link in confirmation email.
  consumerBaseUrl: ${BLISS_CONSUMER_BASE_URL:-http://localhost:3000}

database:
  # DATABASE_URL, when the platform sets it, overrides all three of these at
  # startup — see DatabaseUrlResolver. These are the local-dev fallback.
  url: ${BLISS_DB_URL:-jdbc:postgresql://localhost:5432/bliss}
  user: ${BLISS_DB_USER:-bliss}
  password: ${BLISS_DB_PASSWORD:-bliss_dev}
  runMigrations: ${BLISS_RUN_MIGRATIONS:-true}

jwt:
  secret: ${BLISS_JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
  issuer: bliss-b2b
  ttlMinutes: ${BLISS_JWT_TTL_MINUTES:-60}

sentry:
  dsn: ${BLISS_SENTRY_DSN:-}
  environment: ${BLISS_ENV:-development}
  release: ${BLISS_RELEASE:-unknown}
  tracesSampleRate: ${BLISS_SENTRY_TRACES_SAMPLE_RATE:-0.0}

cors:
  # Comma-separated list of origins permitted to call the API.
  # Prod: https://property.bliss-payments.com,https://guest.bliss-payments.com
  allowedOrigins: ${BLISS_CORS_ORIGINS:-http://localhost:3000}

cookies:
  # Session cookie scope. Local dev is same-origin, so Lax + host-only works.
  # Prod serves the frontend from property./guest.bliss-payments.com and the API
  # from api.bliss-payments.com — cross-site, so it needs None (which forces
  # Secure) plus a Domain on the shared parent:
  #   BLISS_COOKIE_SAMESITE=None
  #   BLISS_COOKIE_DOMAIN=.bliss-payments.com
  sameSite: ${BLISS_COOKIE_SAMESITE:-Lax}
  domain: ${BLISS_COOKIE_DOMAIN:-}

email:
  # Blank Postmark token routes mail to the logging service (dev default).
  postmarkToken: ${BLISS_POSTMARK_TOKEN:-}
  fromAddress: ${BLISS_EMAIL_FROM:-no-reply@bliss.com}

stripe:
  # Blank secretKey leaves Stripe endpoints in not-configured (503) state.
  # Use sk_test_... for development.
  secretKey: ${STRIPE_SECRET_KEY:-}
  publishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
  # Webhook signing secret from `stripe listen --forward-to localhost:8080/api/v1/stripe/webhooks`
  webhookSecret: ${STRIPE_WEBHOOK_SECRET:-}

pms:
  # Cloudbeds OAuth app. clientId/clientSecret from the registered app; blank
  # leaves the Cloudbeds OAuth endpoints in not-configured (503) state.
  # NOTE: CLOUDBEDS_CLIENT_SECRET must be added to backend/.env for the callback
  # token exchange to succeed (only CLOUDBEDS_CLIENT_ID is currently set).
  cloudbeds:
    clientId: ${CLOUDBEDS_CLIENT_ID:-}
    clientSecret: ${CLOUDBEDS_CLIENT_SECRET:-}
    redirectUri: ${CLOUDBEDS_REDIRECT_URI:-http://localhost:8080/api/v1/cloudbeds/oauth/callback}
    # Host/version differs across docs; override here if needed.
    authorizeUrl: ${CLOUDBEDS_AUTHORIZE_URL:-https://hotels.cloudbeds.com/api/v1.3/oauth}
    tokenUrl: ${CLOUDBEDS_TOKEN_URL:-https://hotels.cloudbeds.com/api/v1.3/access_token}
    apiBaseUrl: ${CLOUDBEDS_API_BASE_URL:-https://hotels.cloudbeds.com/api/v1.3}
